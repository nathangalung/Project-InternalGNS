version: "2"
sql:
  - engine: "postgresql"
    schema: "migrations"
    queries: "internal"
    gen:
      go:
        out: "internal"
        package: ""
        sql_package: "pgx/v5"
        emit_interface: true
        emit_json_tags: true
        emit_pointers_for_null_types: true
        emit_exact_table_names: false
        emit_prepared_queries: false
        overrides:
          - db_type: "numeric"
            go_type: "github.com/shopspring/decimal.Decimal"
          - db_type: "timestamptz"
            go_type: "time.Time"
