# GitGuardian scan settings.
# Test fixtures and CI throwaway services carry dummy credentials. Paths
# cover the fixtures; the CI values are matched exactly so a real secret
# added to a workflow is still reported.
version: 2
paths-ignore:
  - "apps/api/**/*_test.go"
  - "apps/web/src/**/*.test.ts"
  - "apps/web/src/**/*.test.tsx"
  - "apps/web/e2e/**"
secret:
  ignored-matches:
    - name: ci postgres password
      match: gns_app
    - name: ci superadmin password
      match: AdminGNS123!
