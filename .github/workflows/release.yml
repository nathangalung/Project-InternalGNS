name: release

on:
  workflow_run:
    workflows: [ci]
    types: [completed]
  workflow_dispatch:
    inputs:
      tag:
        description: "Image tag to push (e.g. v0.1.0)"
        required: true
        type: string

permissions:
  contents: read
  packages: write

# One group per release tag.
# Under workflow_run github.ref is always the default branch, and a group
# keeps one pending run, so a third tag pushed during a release cancelled
# the second one's queued run. A tag's push run and a dispatch of the same
# tag share a group, so two builds never race to push one tag. A ci run from
# a pull request publishes nothing and gets a group of its own, so a branch
# named like a tag cannot cancel that tag's queued release.
concurrency:
  group: >-
    release-${{ github.event.workflow_run.event == 'push'
    && github.event.workflow_run.head_branch
    || inputs.tag
    || github.run_id }}
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io

jobs:
  publish:
    name: publish images
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    # A ci run from a pull request, even one on a branch named v*, must not
    # publish: only a tag pushed to this repository does.
    if: >
      (github.event_name == 'workflow_dispatch') ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'push' &&
       github.event.workflow_run.head_repository.full_name == github.repository &&
       startsWith(github.event.workflow_run.head_branch, 'v'))
    strategy:
      fail-fast: false
      matrix:
        include:
          - service: api
            context: ./apps/api
          - service: web
            context: ./apps/web
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: log in to ghcr
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: resolve tag
        id: tag
        env:
          DISPATCH_TAG: ${{ inputs.tag }}
          WORKFLOW_RUN_BRANCH: ${{ github.event.workflow_run.head_branch }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            echo "value=$DISPATCH_TAG" >> "$GITHUB_OUTPUT"
          else
            echo "value=$WORKFLOW_RUN_BRANCH" >> "$GITHUB_OUTPUT"
          fi
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          echo "short=$(git rev-parse --short=7 HEAD)" >> "$GITHUB_OUTPUT"

      # Checked-out SHA, not github.sha.
      # Under workflow_run github.sha is main's head, not the tag's commit.
      - name: docker metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.REGISTRY }}/${{ github.repository_owner }}/internalgns-${{ matrix.service }}
          tags: |
            type=raw,value=${{ steps.tag.outputs.value }}
            type=raw,value=sha-${{ steps.tag.outputs.short }},priority=100
          labels: |
            org.opencontainers.image.revision=${{ steps.tag.outputs.sha }}

      - name: validate web build args
        if: matrix.service == 'web'
        env:
          VITE_API_URL: ${{ vars.VITE_API_URL }}
        run: |
          if [ -z "$VITE_API_URL" ]; then
            echo "::error::VITE_API_URL repository variable is not set. Add it under Settings > Variables > Actions."
            exit 1
          fi

      - name: build image (local scan)
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ${{ matrix.context }}
          push: false
          load: true
          tags: internalgns-${{ matrix.service }}:scan
          build-args: |
            VERSION=${{ steps.tag.outputs.value }}
            VITE_API_URL=${{ vars.VITE_API_URL }}
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,scope=${{ matrix.service }},mode=max,ignore-error=true
          # The runtime stage installs OS packages, and its cached layer keys only
          # on the Dockerfile line, so a cache hit would ship patches as old as
          # the first build. A release always rebuilds it; build stages stay
          # cached.
          no-cache-filters: runtime

      - name: scan image
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: internalgns-${{ matrix.service }}:scan
          format: table
          exit-code: "1"
          ignore-unfixed: true
          vuln-type: os,library
          severity: CRITICAL,HIGH
          trivyignores: .trivyignore

      - name: build and push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ${{ matrix.context }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VERSION=${{ steps.tag.outputs.value }}
            VITE_API_URL=${{ vars.VITE_API_URL }}
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,scope=${{ matrix.service }},mode=max,ignore-error=true
          # The runtime stage installs OS packages, and its cached layer keys only
          # on the Dockerfile line, so a cache hit would ship patches as old as
          # the first build. A release always rebuilds it; build stages stay
          # cached.
          no-cache-filters: runtime
          provenance: mode=max
          sbom: true
