name: release

on:
  workflow_run:
    workflows: [ci]
    types: [completed]
  workflow_dispatch:
    inputs:
      tag:
        description: "Image tag to push (e.g. v0.1.0)"
        required: true
        type: string

permissions:
  contents: read
  packages: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io

jobs:
  publish:
    name: publish images
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    if: >
      (github.event_name == 'workflow_dispatch') ||
      (github.event.workflow_run.conclusion == 'success' &&
       startsWith(github.event.workflow_run.head_branch, 'v'))
    strategy:
      fail-fast: false
      matrix:
        include:
          - service: api
            context: ./apps/api
          - service: web
            context: ./apps/web
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - uses: docker/setup-buildx-action@v3

      - name: log in to ghcr
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: resolve tag
        id: tag
        env:
          DISPATCH_TAG: ${{ inputs.tag }}
          WORKFLOW_RUN_BRANCH: ${{ github.event.workflow_run.head_branch }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            echo "value=$DISPATCH_TAG" >> "$GITHUB_OUTPUT"
          else
            echo "value=$WORKFLOW_RUN_BRANCH" >> "$GITHUB_OUTPUT"
          fi

      - name: docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ github.repository_owner }}/internalgns-${{ matrix.service }}
          tags: |
            type=raw,value=${{ steps.tag.outputs.value }}
            type=sha,format=short

      - name: validate web build args
        if: matrix.service == 'web'
        env:
          VITE_API_URL: ${{ vars.VITE_API_URL }}
        run: |
          if [ -z "$VITE_API_URL" ]; then
            echo "::error::VITE_API_URL repository variable is not set. Add it under Settings > Variables > Actions."
            exit 1
          fi

      - name: build image (local scan)
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          push: false
          load: true
          tags: internalgns-${{ matrix.service }}:scan
          build-args: |
            VERSION=${{ steps.tag.outputs.value }}
            VITE_API_URL=${{ vars.VITE_API_URL }}
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,scope=${{ matrix.service }},mode=max

      - name: scan image
        uses: aquasecurity/trivy-action@0.35.0
        with:
          image-ref: internalgns-${{ matrix.service }}:scan
          format: table
          exit-code: "1"
          ignore-unfixed: true
          vuln-type: os,library
          severity: CRITICAL,HIGH

      - name: build and push
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VERSION=${{ steps.tag.outputs.value }}
            VITE_API_URL=${{ vars.VITE_API_URL }}
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,scope=${{ matrix.service }},mode=max
          provenance: mode=max
          sbom: true
