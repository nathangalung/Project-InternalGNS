name: ci

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
    tags: ["v*.*.*"]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  backend:
    name: backend (api)
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    defaults:
      run:
        working-directory: apps/api
    services:
      postgres:
        image: postgres:18.6-alpine@sha256:77f585114c32fbca283dc835b0596f4e52b51b4c6662d7810b2f4084f60a1873
        env:
          POSTGRES_DB: gns_citest
          POSTGRES_USER: gns_app
          POSTGRES_PASSWORD: gns_app
          TZ: Asia/Jakarta
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U gns_app -d gns_citest"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Dependabot cannot update workflow images, only compose.dev.yml, so
      # its compose PRs fail here until these pins are copied over.
      - name: ci images match compose.dev.yml
        working-directory: .
        run: |
          refs=$(grep -ohE '(postgres|pgsty/silo):[0-9A-Z][^[:space:]]*' .github/workflows/ci.yml | sort -u)
          test -n "$refs"
          for ref in $refs; do
            grep -qxF "    image: $ref" compose.dev.yml || {
              echo "::error::$ref differs from the compose.dev.yml pin"
              exit 1
            }
          done

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: apps/api/go.mod
          cache-dependency-path: apps/api/go.sum

      - name: go vet
        run: go vet ./...

      - name: web types match the Go DTOs
        run: |
          go run ./cmd/gentypes -out ../web/src/types/generated.ts
          git diff --exit-code -- ../web/src/types/generated.ts

      - name: golangci-lint
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: v2.14
          working-directory: apps/api
          args: --timeout=5m
          # verify fetches the schema from golangci-lint.run at run time.
          verify: false

      # Service containers cannot pass `server /data`, so MinIO runs by hand.
      - name: start minio
        run: |
          docker run -d --name minio -p 9000:9000 \
            -e MINIO_ROOT_USER=minioadmin -e MINIO_ROOT_PASSWORD=minioadmin \
            pgsty/silo:RELEASE.2026-09-16T00-00-00Z@sha256:635197cb9f36d01bee221d34d1c7d7960f6a95c48b0b6c01d99cd13bdae51a46 server /data
          for _ in $(seq 1 30); do
            curl -fsS http://127.0.0.1:9000/minio/health/live && exit 0
            sleep 1
          done
          docker logs minio
          exit 1

      # TEST_DATABASE_URL only: the suites truncate, so they never get a DSN
      # that could point at a real database. One run feeds the coverage gate.
      - name: go test
        env:
          TEST_DATABASE_URL: postgres://gns_app:gns_app@localhost:5432/gns_citest?sslmode=disable
          MINIO_ENDPOINT: 127.0.0.1:9000
          MINIO_ACCESS_KEY: minioadmin
          MINIO_SECRET_KEY: minioadmin
        run: go test ./... -race -count=1 -p=1 -covermode=atomic -coverpkg=./... -coverprofile=coverage.out

      - name: upload coverage profile
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: go-coverage
          path: apps/api/coverage.out
          retention-days: 14

      - name: govulncheck
        uses: golang/govulncheck-action@032d45514ae346b1db93c04b0c90b841c370344f # v1.1.0
        with:
          go-version-file: apps/api/go.mod
          go-package: ./...
          work-dir: apps/api

  # PDF layout gate.
  # The layout tests skip without xelatex, so the backend job never ran them.
  # Here they run inside the api image itself, with the TeX Live the release
  # ships, and any skip other than the root-only permission case fails.
  pdf:
    name: pdf layout (xelatex)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        working-directory: apps/api
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: apps/api/go.mod
          cache-dependency-path: apps/api/go.sum

      - name: download modules
        run: go mod download

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: build api image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ./apps/api
          push: false
          load: true
          tags: internalgns-api:pdf
          cache-from: type=gha,scope=api
          cache-to: type=gha,scope=api,mode=max,ignore-error=true

      # Runner Go, image TeX.
      # The go binary is static, so the runner's toolchain runs in the image.
      # poppler-utils supplies pdfinfo and pdftotext for the page assertions.
      - name: layout tests in the runtime image
        shell: bash
        run: |
          docker run --rm --user root --entrypoint bash \
            -v "$PWD":/src -w /src \
            -v "$(go env GOROOT)":/usr/local/go:ro \
            -v "$(go env GOMODCACHE)":/go/pkg/mod \
            -e GOMODCACHE=/go/pkg/mod -e GOTOOLCHAIN=local -e GOFLAGS=-mod=readonly \
            -e CGO_ENABLED=0 -e PATH=/usr/local/go/bin:/usr/sbin:/usr/bin:/sbin:/bin \
            internalgns-api:pdf -c '
              set -eo pipefail
              apt-get update -qq
              apt-get install -y -qq --no-install-recommends poppler-utils >/dev/null
              xelatex --version | sed -n 1p
              go test -count=1 -v \
                -run "TestLatex|TestRender|TestRealTemplate|PaperSize|TestQuotationPDF|TestInvoiceTemplate" \
                ./internal/pdfgen/ ./internal/quotations/ ./internal/invoices/' | tee pdf.log
          skips=$(grep -- '--- SKIP' pdf.log | grep -v 'TestRender_StagingFailures/asset_unreadable' || true)
          if [ -n "$skips" ]; then
            echo "::error::PDF layout tests skipped; the gate needs every one to run"
            echo "$skips"
            exit 1
          fi

  frontend:
    name: frontend (web)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: apps/web/package.json

      - name: install deps
        run: bun install --frozen-lockfile

      - name: audit deps
        run: bun audit --prod

      - name: lint
        run: bun run lint

      - name: typecheck
        run: bun run typecheck

      - name: test
        run: bun run test

      - name: build
        env:
          VITE_API_URL: /api/v1
        run: bun run build

  # Coverage gates sit off the needs graph: a gate below its tier fails
  # here without skipping lighthouse or the image builds.
  coverage-api:
    name: coverage gate (api)
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    needs: [backend]
    defaults:
      run:
        working-directory: apps/api
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: apps/api/go.mod
          cache-dependency-path: apps/api/go.sum

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: go-coverage
          path: apps/api

      - name: per-package minimums
        run: go run ./scripts/covercheck -profile coverage.out

  coverage-web:
    name: coverage gate (web)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: apps/web/package.json

      - name: install deps
        run: bun install --frozen-lockfile

      - name: vitest coverage
        run: bun run coverage

      - name: upload coverage report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: web-coverage
          path: apps/web/coverage
          retention-days: 14

  e2e:
    name: e2e (playwright)
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    needs: [frontend, backend]
    services:
      postgres:
        image: postgres:18.6-alpine@sha256:77f585114c32fbca283dc835b0596f4e52b51b4c6662d7810b2f4084f60a1873
        env:
          POSTGRES_DB: gns_e2e_test
          POSTGRES_USER: gns_app
          POSTGRES_PASSWORD: gns_app
          TZ: Asia/Jakarta
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U gns_app -d gns_e2e_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
    env:
      DATABASE_URL: postgres://gns_app:gns_app@localhost:5432/gns_e2e_test?sslmode=disable
      HTTP_ADDR: ":8080"
      JWT_SECRET: ci_e2e_secret_do_not_use_in_production
      JWT_EXPIRY: 1h
      CORS_ALLOWED_ORIGINS: "http://127.0.0.1:4173"
      SUPERADMIN_EMAIL: admin@globalsakti.com
      SUPERADMIN_NAME: Administrator
      SUPERADMIN_PASSWORD: AdminGNS123!
      MINIO_ENDPOINT: 127.0.0.1:9000
      MINIO_ACCESS_KEY: minioadmin
      MINIO_SECRET_KEY: minioadmin
      E2E_BASE_URL: http://127.0.0.1:4173
      E2E_API_URL: http://127.0.0.1:8080/api/v1
      E2E_ADMIN_EMAIL: admin@globalsakti.com
      E2E_ADMIN_PASSWORD: AdminGNS123!
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: apps/api/go.mod
          cache-dependency-path: apps/api/go.sum

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: apps/web/package.json

      - name: start minio
        run: |
          docker run -d --name minio -p 9000:9000 \
            -e MINIO_ROOT_USER=minioadmin -e MINIO_ROOT_PASSWORD=minioadmin \
            pgsty/silo:RELEASE.2026-09-16T00-00-00Z@sha256:635197cb9f36d01bee221d34d1c7d7960f6a95c48b0b6c01d99cd13bdae51a46 server /data
          for _ in $(seq 1 30); do
            curl -fsS http://127.0.0.1:9000/minio/health/live && exit 0
            sleep 1
          done
          docker logs minio
          exit 1

      - name: build api
        working-directory: apps/api
        run: go build -o bin/api ./cmd/api

      - name: bootstrap api (migrate + superadmin + master data)
        working-directory: apps/api
        run: |
          ./bin/api -bootstrap
          PGCLIENTENCODING=UTF8 psql "$DATABASE_URL" -v ON_ERROR_STOP=1 < db/seeds/01_master.sql

      # Doubles as the cmd/api boot smoke: the real binary must come up healthy.
      - name: start api
        working-directory: apps/api
        run: |
          ./bin/api > /tmp/api.log 2>&1 &
          echo "API_PID=$!" >> "$GITHUB_ENV"
          for _ in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8080/healthz > /dev/null; then
              echo "api ready"
              exit 0
            fi
            sleep 1
          done
          echo "api never became ready"
          cat /tmp/api.log
          exit 1

      - name: install web deps
        working-directory: apps/web
        run: bun install --frozen-lockfile

      - name: install chromium
        working-directory: apps/web
        run: bunx playwright install --with-deps chromium

      # Cross-origin, as a release builds it: the SPA on :4173 calls the API
      # on :8080. The config builds dist and serves it with the enforcing
      # policy from compose.prod.yml; any violation fails the test.
      - name: playwright under the production CSP
        working-directory: apps/web
        env:
          CI: "true"
        run: bun run e2e:csp

      - name: dump api log on failure
        if: failure()
        run: tail -200 /tmp/api.log || true

      - name: stop api
        if: always()
        run: kill "$API_PID" 2>/dev/null || true

      - name: upload playwright report
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: playwright-report
          path: |
            apps/web/e2e/.report
            apps/web/e2e/.results
          retention-days: 14

  lighthouse:
    name: lighthouse (all pages)
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    needs: [frontend, backend]
    services:
      postgres:
        image: postgres:18.6-alpine@sha256:77f585114c32fbca283dc835b0596f4e52b51b4c6662d7810b2f4084f60a1873
        env:
          POSTGRES_DB: gns_citest
          POSTGRES_USER: gns_app
          POSTGRES_PASSWORD: gns_app
          TZ: Asia/Jakarta
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U gns_app -d gns_citest"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
    env:
      DATABASE_URL: postgres://gns_app:gns_app@localhost:5432/gns_citest?sslmode=disable
      HTTP_ADDR: ":8080"
      JWT_SECRET: ci_lighthouse_secret_do_not_use_in_prod
      JWT_EXPIRY: 1h
      CORS_ALLOWED_ORIGINS: "http://127.0.0.1:4173"
      SUPERADMIN_EMAIL: admin@globalsakti.com
      SUPERADMIN_NAME: Administrator
      SUPERADMIN_PASSWORD: AdminGNS123!
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: apps/api/go.mod
          cache-dependency-path: apps/api/go.sum

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: apps/web/package.json

      - name: bootstrap api (migrate + seed)
        working-directory: apps/api
        run: go run ./cmd/api --bootstrap

      - name: start api
        working-directory: apps/api
        run: |
          go run ./cmd/api > /tmp/api.log 2>&1 &
          echo "API_PID=$!" >> "$GITHUB_ENV"
          for _ in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8080/healthz > /dev/null; then
              echo "api ready"
              exit 0
            fi
            sleep 1
          done
          echo "api never became ready"
          cat /tmp/api.log
          exit 1

      - name: install web deps
        working-directory: apps/web
        run: bun install --frozen-lockfile

      - name: install chrome
        id: setup-chrome
        uses: browser-actions/setup-chrome@48ad923757ca74d66703209fe939badbdf80f2f4 # v2.2.0
        with:
          chrome-version: stable

      - name: build web
        working-directory: apps/web
        env:
          VITE_API_URL: http://127.0.0.1:8080/api/v1
        run: bun run build

      - name: run lhci
        working-directory: apps/web
        env:
          CHROME_PATH: ${{ steps.setup-chrome.outputs.chrome-path }}
          LHCI_API_URL: http://127.0.0.1:8080/api/v1
          LHCI_EMAIL: admin@globalsakti.com
          LHCI_PASSWORD: AdminGNS123!
        run: bun run lighthouse

      - name: dump api log on failure
        if: failure()
        run: tail -200 /tmp/api.log || true

      - name: stop api
        if: always()
        run: kill "$API_PID" 2>/dev/null || true

      - name: upload lhci report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: lighthouse-report
          path: apps/web/.lighthouseci
          retention-days: 14

  security:
    name: filesystem scan
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: trivy fs scan
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          format: table
          exit-code: "1"
          ignore-unfixed: true
          severity: CRITICAL,HIGH
          skip-dirs: apps/web/node_modules,apps/web/dist

  images:
    name: build images (smoke)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: build api image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ./apps/api
          push: false
          tags: internalgns-api:ci
          cache-from: type=gha,scope=api
          cache-to: type=gha,scope=api,mode=max,ignore-error=true

      - name: build web image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ./apps/web
          push: false
          build-args: |
            VITE_API_URL=/api/v1
          tags: internalgns-web:ci
          cache-from: type=gha,scope=web
          cache-to: type=gha,scope=web,mode=max,ignore-error=true
