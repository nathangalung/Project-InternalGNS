name: ci

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
    tags: ["v*.*.*"]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  backend:
    name: backend (api)
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    defaults:
      run:
        working-directory: apps/api
    services:
      postgres:
        image: postgres:18.3-alpine
        env:
          POSTGRES_DB: gns_citest
          POSTGRES_USER: gns_app
          POSTGRES_PASSWORD: gns_app
          TZ: Asia/Jakarta
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U gns_app -d gns_citest"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-go@v6
        with:
          go-version-file: apps/api/go.mod
          cache-dependency-path: apps/api/go.sum

      - name: go vet
        run: go vet ./...

      - name: golangci-lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.11
          working-directory: apps/api
          args: --timeout=5m

      # Service containers cannot pass `server /data`, so MinIO runs by hand.
      - name: start minio
        run: |
          docker run -d --name minio -p 9000:9000 \
            -e MINIO_ROOT_USER=minioadmin -e MINIO_ROOT_PASSWORD=minioadmin \
            pgsty/silo:RELEASE.2026-09-16T00-00-00Z server /data
          for i in $(seq 1 30); do
            curl -fsS http://127.0.0.1:9000/minio/health/live && exit 0
            sleep 1
          done
          docker logs minio
          exit 1

      # TEST_DATABASE_URL only: the suites truncate, so they never get a DSN
      # that could point at a real database. One run feeds the coverage gate.
      - name: go test
        env:
          TEST_DATABASE_URL: postgres://gns_app:gns_app@localhost:5432/gns_citest?sslmode=disable
          MINIO_ENDPOINT: 127.0.0.1:9000
          MINIO_ACCESS_KEY: minioadmin
          MINIO_SECRET_KEY: minioadmin
        run: go test ./... -race -count=1 -p=1 -covermode=atomic -coverpkg=./... -coverprofile=coverage.out

      - name: upload coverage profile
        uses: actions/upload-artifact@v4
        with:
          name: go-coverage
          path: apps/api/coverage.out
          retention-days: 14

      - name: govulncheck
        uses: golang/govulncheck-action@v1
        with:
          go-version-file: apps/api/go.mod
          go-package: ./...
          work-dir: apps/api

  # PDF layout gate.
  # The layout tests skip without xelatex, so the backend job never ran them.
  # Here they run inside the api image itself, with the TeX Live the release
  # ships, and any skip other than the root-only permission case fails.
  pdf:
    name: pdf layout (xelatex)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        working-directory: apps/api
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-go@v6
        with:
          go-version-file: apps/api/go.mod
          cache-dependency-path: apps/api/go.sum

      - name: download modules
        run: go mod download

      - uses: docker/setup-buildx-action@v3

      - name: build api image
        uses: docker/build-push-action@v6
        with:
          context: ./apps/api
          push: false
          load: true
          tags: internalgns-api:pdf
          cache-from: type=gha,scope=api
          cache-to: type=gha,scope=api,mode=max

      # Runner Go, image TeX.
      # The go binary is static, so the runner's toolchain runs in the image.
      # poppler-utils supplies pdfinfo and pdftotext for the page assertions.
      - name: layout tests in the runtime image
        shell: bash
        run: |
          docker run --rm --user root --entrypoint bash \
            -v "$PWD":/src -w /src \
            -v "$(go env GOROOT)":/usr/local/go:ro \
            -v "$(go env GOMODCACHE)":/go/pkg/mod \
            -e GOMODCACHE=/go/pkg/mod -e GOTOOLCHAIN=local -e GOFLAGS=-mod=readonly \
            -e CGO_ENABLED=0 -e PATH=/usr/local/go/bin:/usr/sbin:/usr/bin:/sbin:/bin \
            internalgns-api:pdf -c '
              set -eo pipefail
              apt-get update -qq
              apt-get install -y -qq --no-install-recommends poppler-utils >/dev/null
              xelatex --version | sed -n 1p
              go test -count=1 -v \
                -run "TestLatex|TestRender|TestRealTemplate|PaperSize|TestQuotationPDF|TestInvoiceTemplate" \
                ./internal/pdfgen/ ./internal/quotations/ ./internal/invoices/' | tee pdf.log
          skips=$(grep -- '--- SKIP' pdf.log | grep -v 'TestRender_StagingFailures/asset_unreadable' || true)
          if [ -n "$skips" ]; then
            echo "::error::PDF layout tests skipped; the gate needs every one to run"
            echo "$skips"
            exit 1
          fi

  frontend:
    name: frontend (web)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v5

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: apps/web/package.json

      - name: install deps
        run: bun install --frozen-lockfile

      # Ignore uuid GHSA: exceljs/lhci use v4 only, no buf param, not exploitable.
      - name: audit deps
        run: bun audit --prod --ignore GHSA-w5hq-g745-h8pq

      - name: lint
        run: bun run lint

      - name: typecheck
        run: bun run typecheck

      - name: test
        run: bun run test

      - name: build
        env:
          VITE_API_URL: /api/v1
        run: bun run build

  # Coverage gates sit off the needs graph: a gate below its tier fails
  # here without skipping lighthouse or the image builds.
  coverage-api:
    name: coverage gate (api)
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    needs: [backend]
    defaults:
      run:
        working-directory: apps/api
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-go@v6
        with:
          go-version-file: apps/api/go.mod
          cache-dependency-path: apps/api/go.sum

      - uses: actions/download-artifact@v4
        with:
          name: go-coverage
          path: apps/api

      - name: per-package minimums
        run: go run ./scripts/covercheck -profile coverage.out

  coverage-web:
    name: coverage gate (web)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v5

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: apps/web/package.json

      - name: install deps
        run: bun install --frozen-lockfile

      - name: vitest coverage
        run: bun run coverage

      - name: upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: web-coverage
          path: apps/web/coverage
          retention-days: 14

  e2e:
    name: e2e (playwright)
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    needs: [frontend, backend]
    services:
      postgres:
        image: postgres:18.3-alpine
        env:
          POSTGRES_DB: gns_e2e_test
          POSTGRES_USER: gns_app
          POSTGRES_PASSWORD: gns_app
          TZ: Asia/Jakarta
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U gns_app -d gns_e2e_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
    env:
      DATABASE_URL: postgres://gns_app:gns_app@localhost:5432/gns_e2e_test?sslmode=disable
      HTTP_ADDR: ":8080"
      JWT_SECRET: ci_e2e_secret_do_not_use_in_production
      JWT_EXPIRY: 1h
      CORS_ALLOWED_ORIGINS: "*"
      SUPERADMIN_EMAIL: admin@globalsakti.com
      SUPERADMIN_NAME: Administrator
      SUPERADMIN_PASSWORD: AdminGNS123!
      MINIO_ENDPOINT: 127.0.0.1:9000
      MINIO_ACCESS_KEY: minioadmin
      MINIO_SECRET_KEY: minioadmin
      E2E_BASE_URL: http://127.0.0.1:4173
      E2E_ADMIN_EMAIL: admin@globalsakti.com
      E2E_ADMIN_PASSWORD: AdminGNS123!
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-go@v6
        with:
          go-version-file: apps/api/go.mod
          cache-dependency-path: apps/api/go.sum

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: apps/web/package.json

      - name: start minio
        run: |
          docker run -d --name minio -p 9000:9000 \
            -e MINIO_ROOT_USER=minioadmin -e MINIO_ROOT_PASSWORD=minioadmin \
            pgsty/silo:RELEASE.2026-09-16T00-00-00Z server /data
          for i in $(seq 1 30); do
            curl -fsS http://127.0.0.1:9000/minio/health/live && exit 0
            sleep 1
          done
          docker logs minio
          exit 1

      - name: build api
        working-directory: apps/api
        run: go build -o bin/api ./cmd/api

      - name: bootstrap api (migrate + superadmin + master data)
        working-directory: apps/api
        run: |
          ./bin/api -bootstrap
          PGCLIENTENCODING=UTF8 psql "$DATABASE_URL" -v ON_ERROR_STOP=1 < db/seeds/01_master.sql

      # Doubles as the cmd/api boot smoke: the real binary must come up healthy.
      - name: start api
        working-directory: apps/api
        run: |
          ./bin/api > /tmp/api.log 2>&1 &
          echo "API_PID=$!" >> "$GITHUB_ENV"
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8080/healthz > /dev/null; then
              echo "api ready"
              exit 0
            fi
            sleep 1
          done
          echo "api never became ready"
          cat /tmp/api.log
          exit 1

      - name: install web deps
        working-directory: apps/web
        run: bun install --frozen-lockfile

      - name: install chromium
        working-directory: apps/web
        run: bunx playwright install --with-deps chromium

      # Same-origin build; vite preview proxies /api to :8080 like the dev server.
      - name: build and serve web
        working-directory: apps/web
        env:
          VITE_API_URL: /api/v1
        run: |
          bun run build
          bun run preview --port 4173 --strictPort --host 127.0.0.1 > /tmp/preview.log 2>&1 &
          for i in $(seq 1 30); do
            curl -fsS http://127.0.0.1:4173/login > /dev/null && exit 0
            sleep 1
          done
          cat /tmp/preview.log
          exit 1

      - name: playwright
        working-directory: apps/web
        env:
          CI: "true"
        run: bun run e2e

      - name: dump api log on failure
        if: failure()
        run: tail -200 /tmp/api.log || true

      - name: stop api
        if: always()
        run: kill $API_PID 2>/dev/null || true

      - name: upload playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            apps/web/e2e/.report
            apps/web/e2e/.results
          retention-days: 14

  lighthouse:
    name: lighthouse (all pages)
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    needs: [frontend, backend]
    services:
      postgres:
        image: postgres:18.3-alpine
        env:
          POSTGRES_DB: gns_citest
          POSTGRES_USER: gns_app
          POSTGRES_PASSWORD: gns_app
          TZ: Asia/Jakarta
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U gns_app -d gns_citest"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
    env:
      DATABASE_URL: postgres://gns_app:gns_app@localhost:5432/gns_citest?sslmode=disable
      HTTP_ADDR: ":8080"
      JWT_SECRET: ci_lighthouse_secret_do_not_use_in_prod
      JWT_EXPIRY: 1h
      CORS_ALLOWED_ORIGINS: "*"
      SUPERADMIN_EMAIL: admin@globalsakti.com
      SUPERADMIN_NAME: Administrator
      SUPERADMIN_PASSWORD: AdminGNS123!
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-go@v6
        with:
          go-version-file: apps/api/go.mod
          cache-dependency-path: apps/api/go.sum

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: apps/web/package.json

      - name: bootstrap api (migrate + seed)
        working-directory: apps/api
        run: go run ./cmd/api --bootstrap

      - name: start api
        working-directory: apps/api
        run: |
          go run ./cmd/api > /tmp/api.log 2>&1 &
          echo "API_PID=$!" >> "$GITHUB_ENV"
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8080/healthz > /dev/null; then
              echo "api ready"
              exit 0
            fi
            sleep 1
          done
          echo "api never became ready"
          cat /tmp/api.log
          exit 1

      - name: install web deps
        working-directory: apps/web
        run: bun install --frozen-lockfile

      - name: install chrome
        id: setup-chrome
        uses: browser-actions/setup-chrome@v1
        with:
          chrome-version: stable

      - name: build web
        working-directory: apps/web
        env:
          VITE_API_URL: http://127.0.0.1:8080/api/v1
        run: bun run build

      - name: run lhci
        working-directory: apps/web
        env:
          CHROME_PATH: ${{ steps.setup-chrome.outputs.chrome-path }}
          LHCI_API_URL: http://127.0.0.1:8080/api/v1
          LHCI_EMAIL: admin@globalsakti.com
          LHCI_PASSWORD: AdminGNS123!
        run: bun run lighthouse

      - name: dump api log on failure
        if: failure()
        run: tail -200 /tmp/api.log || true

      - name: stop api
        if: always()
        run: kill $API_PID 2>/dev/null || true

      - name: upload lhci report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lighthouse-report
          path: apps/web/.lighthouseci
          retention-days: 14

  security:
    name: filesystem scan
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5

      - name: trivy fs scan
        uses: aquasecurity/trivy-action@0.35.0
        with:
          scan-type: fs
          scan-ref: .
          format: table
          exit-code: "1"
          ignore-unfixed: true
          severity: CRITICAL,HIGH
          skip-dirs: apps/web/node_modules,apps/web/dist

  images:
    name: build images (smoke)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v5

      - uses: docker/setup-buildx-action@v3

      - name: build api image
        uses: docker/build-push-action@v6
        with:
          context: ./apps/api
          push: false
          tags: internalgns-api:ci
          cache-from: type=gha,scope=api
          cache-to: type=gha,scope=api,mode=max

      - name: build web image
        uses: docker/build-push-action@v6
        with:
          context: ./apps/web
          push: false
          build-args: |
            VITE_API_URL=/api/v1
          tags: internalgns-web:ci
          cache-from: type=gha,scope=web
          cache-to: type=gha,scope=web,mode=max
