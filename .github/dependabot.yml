version: 2
updates:
  - package-ecosystem: gomod
    directory: /apps/api
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Asia/Jakarta
    open-pull-requests-limit: 5
    labels:
      - dependencies
      - backend
    groups:
      go-minor-patch:
        update-types:
          - minor
          - patch

  # The web app is locked by bun.lock. The npm ecosystem bumped package.json
  # without refreshing it, so every PR died on bun install --frozen-lockfile.
  # Bun has no Dependabot security updates; CI's bun audit covers that gap.
  - package-ecosystem: bun
    directory: /apps/web
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Asia/Jakarta
    open-pull-requests-limit: 5
    labels:
      - dependencies
      - frontend
    groups:
      web-minor-patch:
        update-types:
          - minor
          - patch
      tanstack:
        patterns:
          - "@tanstack/*"
    # Majors (@types/node 26) need a planned migration.
    ignore:
      - dependency-name: "*"
        update-types:
          - version-update:semver-major

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Asia/Jakarta
    open-pull-requests-limit: 3
    labels:
      - dependencies
      - ci
    groups:
      actions:
        patterns:
          - "*"

  # Base images are pinned as tag@sha256 index digests; these entries move
  # both. Workflow images cannot be tracked, so ci.yml copies the compose
  # pins and fails until it matches both compose files.
  - package-ecosystem: docker
    directory: /apps/api
    schedule:
      interval: monthly
      time: "06:00"
      timezone: Asia/Jakarta
    labels:
      - dependencies
      - docker

  - package-ecosystem: docker
    directory: /apps/web
    schedule:
      interval: monthly
      time: "06:00"
      timezone: Asia/Jakarta
    labels:
      - dependencies
      - docker
    # nginx follows the stable branch (even minor). Odd minors are mainline,
    # so take patches here and move to the next stable branch by hand.
    ignore:
      - dependency-name: nginx
        update-types:
          - version-update:semver-minor

  # compose.dev.yml and compose.prod.yml. pgsty/silo gets digest updates for
  # its tag only: RELEASE.<timestamp> tags do not parse as versions, so move
  # the tag by hand (docs/deploy_vps.md). A postgres major needs a dump and
  # restore, not a bump.
  - package-ecosystem: docker-compose
    directory: /
    schedule:
      interval: monthly
      time: "06:00"
      timezone: Asia/Jakarta
    labels:
      - dependencies
      - docker
    ignore:
      - dependency-name: postgres
        update-types:
          - version-update:semver-major
