version: 2
updates:
  - package-ecosystem: gomod
    directory: /apps/api
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Asia/Jakarta
    open-pull-requests-limit: 5
    labels:
      - dependencies
      - backend
    groups:
      go-minor-patch:
        update-types:
          - minor
          - patch

  # The web app is locked by bun.lock. The npm ecosystem bumped package.json
  # without refreshing it, so every PR died on bun install --frozen-lockfile.
  # Bun has no Dependabot security updates; CI's bun audit covers that gap.
  - package-ecosystem: bun
    directory: /apps/web
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Asia/Jakarta
    open-pull-requests-limit: 5
    labels:
      - dependencies
      - frontend
    groups:
      web-minor-patch:
        update-types:
          - minor
          - patch
      tanstack:
        patterns:
          - "@tanstack/*"
    # Majors (TypeScript 7, Vite 8, @types/node 26) need a planned migration.
    ignore:
      - dependency-name: "*"
        update-types:
          - version-update:semver-major

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Asia/Jakarta
    open-pull-requests-limit: 3
    labels:
      - dependencies
      - ci
    groups:
      actions:
        patterns:
          - "*"

  - package-ecosystem: docker
    directory: /apps/api
    schedule:
      interval: monthly
      time: "06:00"
      timezone: Asia/Jakarta
    labels:
      - dependencies
      - docker

  - package-ecosystem: docker
    directory: /apps/web
    schedule:
      interval: monthly
      time: "06:00"
      timezone: Asia/Jakarta
    labels:
      - dependencies
      - docker
