name: internalgns-dev

services:
  postgres:
    image: postgres:18.3-alpine
    environment:
      POSTGRES_DB: gns_quotation
      POSTGRES_USER: gns_app
      POSTGRES_PASSWORD: gns_app
      TZ: Asia/Jakarta
    ports:
      - "5432:5432"
    volumes:
      - pgdata_dev:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gns_app -d gns_quotation"]
      interval: 5s
      timeout: 3s
      retries: 10

  pgweb:
    image: sosedoff/pgweb:0.17.0
    restart: unless-stopped
    environment:
      DATABASE_URL: postgres://gns_app:gns_app@postgres:5432/gns_quotation?sslmode=disable
    ports:
      - "8081:8081"
    depends_on:
      postgres:
        condition: service_healthy

  minio:
    image: minio/minio:RELEASE.2025-09-07T16-13-09Z
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
      MINIO_API_CORS_ALLOW_ORIGIN: "http://localhost:5173,http://localhost:5174,http://localhost:8080,http://127.0.0.1:5173,http://127.0.0.1:5174"
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - miniodata_dev:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build:
      context: ./apps/api
      dockerfile: Dockerfile
    environment:
      ENV: development
      HTTP_ADDR: ":8080"
      TZ: Asia/Jakarta
      DATABASE_URL: postgres://gns_app:gns_app@postgres:5432/gns_quotation?sslmode=disable
      JWT_SECRET: dev_jwt_secret_change_me_with_openssl_rand_hex_32
      JWT_EXPIRY: 24h
      CORS_ALLOWED_ORIGINS: "*"
      SUPERADMIN_EMAIL: admin@globalsakti.com
      SUPERADMIN_NAME: Administrator
      SUPERADMIN_PASSWORD: AdminGNS123!
      MINIO_ENDPOINT: minio:9000
      MINIO_ACCESS_KEY: minioadmin
      MINIO_SECRET_KEY: minioadmin
      MINIO_USE_SSL: "false"
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy

volumes:
  pgdata_dev:
  miniodata_dev:
