name: internalgns-dev

services:
  postgres:
    image: postgres:18.6-alpine@sha256:77f585114c32fbca283dc835b0596f4e52b51b4c6662d7810b2f4084f60a1873
    environment:
      POSTGRES_DB: gns_quotation
      POSTGRES_USER: gns_app
      POSTGRES_PASSWORD: gns_app
      TZ: Asia/Jakarta
    ports:
      - "5432:5432"
    volumes:
      - pgdata_dev:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gns_app -d gns_quotation"]
      interval: 5s
      timeout: 3s
      retries: 10

  pgweb:
    image: sosedoff/pgweb:0.17.0@sha256:a5256d416e2e8b92d69a4459058e3eca33a9f075d8325491644411d0bc3bd70b
    restart: unless-stopped
    environment:
      DATABASE_URL: postgres://gns_app:gns_app@postgres:5432/gns_quotation?sslmode=disable
    ports:
      - "8081:8081"
    depends_on:
      postgres:
        condition: service_healthy

  minio:
    # Silo, the maintained MinIO fork: docs/deploy_vps.md.
    image: pgsty/silo:RELEASE.2026-09-16T00-00-00Z@sha256:635197cb9f36d01bee221d34d1c7d7960f6a95c48b0b6c01d99cd13bdae51a46
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - miniodata_dev:/data
    healthcheck:
      # Exits 1 at once when down; mcli ready retries forever.
      test: ["CMD", "silo", "healthcheck", "--timeout", "3s", "cluster"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build:
      context: ./apps/api
      dockerfile: Dockerfile
    environment:
      ENV: development
      HTTP_ADDR: ":8080"
      TZ: Asia/Jakarta
      DATABASE_URL: postgres://gns_app:gns_app@postgres:5432/gns_quotation?sslmode=disable
      # Fixed local-only value. Deliberately contains no placeholder wording:
      # config rejects unreplaced template secrets in every environment, since a
      # deploy that forgets ENV=production would otherwise skip every guard.
      JWT_SECRET: local_dev_only_jwt_signing_key_0123456789abcdef
      JWT_EXPIRY: 24h
      CORS_ALLOWED_ORIGINS: "http://localhost:5174"
      SUPERADMIN_EMAIL: admin@globalsakti.com
      SUPERADMIN_NAME: Administrator
      SUPERADMIN_PASSWORD: AdminGNS123!
      MINIO_ENDPOINT: minio:9000
      MINIO_ACCESS_KEY: minioadmin
      MINIO_SECRET_KEY: minioadmin
      MINIO_USE_SSL: "false"
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy

volumes:
  pgdata_dev:
  miniodata_dev:
